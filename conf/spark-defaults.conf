spark.cleaner.referenceTracking.cleanCheckpoints true
spark.databricks.cluster.profile singleNode
spark.databricks.streaming.statefulOperator.asyncCheckpoint.enabled true
spark.log.level WARN
spark.memory.fraction 0.7
spark.memory.storageFraction 0.4
spark.sql.session.timeZone Asia/Taipei
spark.sql.shuffle.partitions 4
spark.sql.streaming.minBatchesToRetain 30
spark.sql.streaming.noDataMicroBatches.enabled false
spark.sql.streaming.stateStore.maintenanceInterval 30s
spark.sql.streaming.stateStore.minDeltasForSnapshot 30
spark.sql.streaming.stateStore.providerClass com.databricks.sql.streaming.state.RocksDBStateStoreProvider
spark.sql.streaming.stateStore.rocksdb.blockCacheSizeMB 512
spark.sql.streaming.stateStore.rocksdb.changelogCheckpointing.enabled true
spark.sql.streaming.stateStore.rocksdb.compactOnCommit false
spark.sql.streaming.stateStore.rocksdb.maxOpenFiles 5000
spark.sql.streaming.stateStore.rocksdb.maxWriteBufferNumber 4
spark.sql.streaming.stateStore.rocksdb.trackTotalNumberOfRows false
spark.sql.streaming.stateStore.rocksdb.writeBufferSizeMB 256
spark.sql.streaming.stateStore.stateSchemaCheck false
spark.sql.streaming.statefulOperator.stateRebalancing.enabled true
spark.storage.memoryFraction 0.4
spark.streaming.backpressure.enabled true
spark.streaming.backpressure.initialRate 10
spark.streaming.kafka.maxRatePerPartition 50000
spark.streaming.stopGracefullyOnShutdown true